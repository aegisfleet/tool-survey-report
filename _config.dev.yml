# 開発・デバッグ用高速ビルド設定
#
# この設定ファイルを _config.yml に重ねて読み込ませることで、
# 大半のレポート（_reports/）をビルド対象から除外して起動を高速化します。
#
# 使い方:
# bundle exec jekyll serve --config _config.yml,_config.dev.yml

exclude:
  # テスト対象（a2ui, granola, oauth, testrail, wovn-io等）のみをビルド
  - "_reports/[b-f]*"
  - "_reports/[h-n]*"
  - "_reports/[p-s]*"
  - "_reports/[u-v]*"
  - "_reports/[x-z]*"
  - "_reports/0*"
  - "_reports/1*"
  - "_reports/2*"
  - "_reports/3*"
  - "_reports/4*"
  - "_reports/5*"
  - "_reports/6*"
  - "_reports/7*"
  - "_reports/8*"
  - "_reports/9*"
  - "vendor/bundle"
