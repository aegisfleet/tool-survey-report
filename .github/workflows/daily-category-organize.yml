name: Daily Category Organize with Antigravity CLI

on:
  schedule:
    # 日本時間の12時 (UTC: 3) に実行
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（PRを作成せず、プロンプトのみ確認）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  organize-categories:
    name: Organize categories/tags using Antigravity CLI
    runs-on: [self-hosted, e2-micro, agy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Category Organization
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          bash .github/workflows/scripts/daily-category-organize.sh
