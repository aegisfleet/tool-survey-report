name: Daily Report Maintenance

on:
  schedule:
    # 日本時間の6時を起点に8時間毎 (UTC: 21, 5, 13)
    - cron: '0 5,13,21 * * *'
  workflow_dispatch:
    inputs:
      report_count:
        description: '更新するレポート数'
        required: false
        default: '1'
        type: string
      target_report:
        description: '更新する特定のレポート名 (ファイル名またはツール名)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-report-and-organize:
    name: Update report and organize category/tags
    runs-on: [self-hosted, e2-micro, agy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Daily Report Maintenance
        env:
          REPORT_COUNT: ${{ github.event.inputs.report_count || '1' }}
          TARGET_REPORT: ${{ github.event.inputs.target_report || '' }}
        run: |
          bash .github/workflows/scripts/daily-report-maintenance.sh
