name: Create Survey Report

env:
  TZ: Asia/Tokyo

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'レポート作成対象の公式URL (公式サイトまたはリポジトリURL)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-report:
    name: Create report
    runs-on: [self-hosted, e2-micro, agy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Survey Report Creation
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          bash .github/workflows/scripts/create-report.sh
