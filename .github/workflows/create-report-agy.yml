name: Create Survey Report with Antigravity CLI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'レポート作成対象の公式URL (公式サイトまたはリポジトリURL)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-report:
    name: Create report using Antigravity CLI (agy)
    runs-on: [self-hosted, e2-micro, agy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git and GitHub CLI
        run: |
          set -euo pipefail
          GH_USER=$(gh api user --jq .login)
          GH_EMAIL=$(gh api user --jq '.email // "\(.id)+\(.login)@users.noreply.github.com"')
          git config user.name "$GH_USER"
          git config user.email "$GH_EMAIL"
          gh auth setup-git

      - name: Create branch and run Antigravity CLI
        run: |
          set -euo pipefail

          BRANCH_NAME="create-report-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

          TARGET_URL="${{ github.event.inputs.target_url }}"

          read -r -d '' PROMPT << 'EOF' || true
          # 新規調査レポート作成指令

          対象URL: __TARGET_URL__

          上記URL（公式サイトまたはGitHubリポジトリ）のツールについて、包括的な調査を行い新規調査レポートを作成せよ。

          ## 遵守すべき手順書・テンプレート
          1. **基本作成手順**: `task-report-create-or-update.md` を参照し、「新規作成時の優先度」および全18セクション構成・形式・ガイドラインに厳密に従ってレポートを作成すること。
          2. **テンプレート**: `templates/template.md` の構成を完全に再現して `_reports/{tool-slug}.md` を作成すること（ファイル名はツール名のケバブケース英小文字）。
          3. **カテゴリ・タグ・関連付けの整理**: `task-organizing-category-tags.md` を参照し、標準語彙に従ってカテゴリ・タグを設定し、必要に応じて `_data/categories.yml` を更新すること。
          4. **CodeWiki / DeepWikiリンクの規則**:
             - 推測によるURL記載は厳禁とする。実在確認が取れない場合はリンクを記載しないこと。
             - OSSリポジトリの場合は、`pnpm run update-wiki _reports/{tool-slug}.md` を実行して実在するWikiリンクのみを反映すること。
          5. **動作原理・システム構成**:
             - 読者の理解を深めるため、日本語のMermaid図（フロー図や構成図）を可能な限り作成すること。
          6. **ブラウザ検証（Playwright）のスキップ**:
             - 本環境（e2-micro）のリソース制約を考慮し、Playwrightなどのブラウザを起動する検証（`--browser`）は実行しないこと。

          ## 完了条件
          - `_reports/` 配下に新規レポートファイルが生成されていること。
          - `_data/categories.yml` の整合性が保たれていること。
          - レポート作成後、ユーザーへの質問や確認（「提出してよいですか？」など）は一切行わず、自律的に作業を確定・完了させること。
          EOF

          PROMPT="${PROMPT//__TARGET_URL__/$TARGET_URL}"

          export SSH_CONNECTION="dummy 1 2 3"
          agy -p "$PROMPT" --print-timeout 40m --output-format json < /dev/null | tee agy_output.json

      - name: Commit changes and create Pull Request
        run: |
          set -euo pipefail

          # 変更があるか確認
          if [ -z "$(git status --porcelain _reports _data/categories.yml)" ]; then
            echo "No report or category changes detected after agy execution."
            exit 1
          fi

          git add _reports/ _data/categories.yml

          # ステージングされたレポートファイルからtool_nameを抽出
          NEW_REPORT=$(git diff --cached --name-only | grep -E '^_reports/.*\.md$' | head -n 1)
          TOOL_NAME=""
          if [ -n "$NEW_REPORT" ] && [ -f "$NEW_REPORT" ]; then
            TOOL_NAME=$(grep -E '^tool_name:' "$NEW_REPORT" | head -n 1 | sed -E 's/^tool_name:[[:space:]]*["'\'']?([^"'\'']+)["'\'']?/\1/' || echo "")
          fi
          if [ -z "$TOOL_NAME" ]; then
            TOOL_NAME="new tool"
          fi

          git commit -m "feat: add survey report for ${TOOL_NAME}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "feat: add survey report for ${TOOL_NAME}" \
            --body "Automated survey report generated by Antigravity CLI (agy) for ${{ github.event.inputs.target_url }}"

