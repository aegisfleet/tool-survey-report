name: Generate Daily Trending Topics Report

env:
  TZ: Asia/Tokyo

on:
  schedule:
    # 毎日 日本時間 6:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      focus_topic:
        description: '特に注力して調査したいトピックがあれば指定'
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate-trending:
    name: Generate Daily Trending Topics
    runs-on: [self-hosted, e2-micro, agy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run Trending Report Generation
        env:
          FOCUS_TOPIC: ${{ github.event.inputs.focus_topic || '' }}
        run: |
          bash .github/workflows/scripts/generate-trending-report.sh
